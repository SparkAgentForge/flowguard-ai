worker_processes 1;
daemon off;
pid ../.runtime/nginx.pid;
error_log ../.runtime/nginx-error.log warn;

events {
    worker_connections 1024;
}

http {
    include ../.tools/nginx/etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log ../.runtime/nginx-access.log;
    client_body_temp_path ../.runtime/client-body;
    fastcgi_temp_path ../.runtime/fastcgi;
    proxy_temp_path ../.runtime/proxy;
    scgi_temp_path ../.runtime/scgi;
    uwsgi_temp_path ../.runtime/uwsgi;
    client_max_body_size 500m;
    sendfile on;

    server {
        listen 0.0.0.0:8888;
        server_name _;

        auth_basic "FlowGuard AI";
        auth_basic_user_file .htpasswd;

        root ../apps/web/dist;
        index index.html;

        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_read_timeout 600s;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
